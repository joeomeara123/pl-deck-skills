<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fingerprint-scan — Biometric Trace v3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, -apple-system, sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 80px;
  }
  h1 { font-size: 1.4rem; font-weight: 300; letter-spacing: -0.01em; }
  h1 span { font-weight: 600; color: #0000FF; }
  .subtitle {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.12em; color: rgba(0,0,255,0.45);
  }
  .icon-card {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .icon-card svg { width: 160px; height: 160px; }
  .icon-name { font-size: 13px; font-weight: 500; color: #1a1a1a; }
  .icon-tags { font-size: 10px; font-weight: 400; color: #94a3b8; }

  /* ═══════════════════════════════════════════════════ */
  /*  BIOMETRIC TRACE — Pure dashoffset draw & erase    */
  /*  Staggered from center outward (left-to-right scan)*/
  /* ═══════════════════════════════════════════════════ */
  .icon-biometric-trace .fp-1 path,
  .icon-biometric-trace .fp-2 path,
  .icon-biometric-trace .fp-3 path,
  .icon-biometric-trace .fp-4 path,
  .icon-biometric-trace .fp-5 path {
    stroke-dasharray: 100 200;
    stroke-dashoffset: 105;
    animation: traceAndErase 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  .icon-biometric-trace .fp-1 path { animation-delay: 0s; }
  .icon-biometric-trace .fp-2 path { animation-delay: 0.15s; }
  .icon-biometric-trace .fp-3 path { animation-delay: 0.3s; }
  .icon-biometric-trace .fp-4 path { animation-delay: 0.45s; }
  .icon-biometric-trace .fp-5 path { animation-delay: 0.6s; }

  .icon-biometric-trace .icon-gradient {
    opacity: 0;
    animation: gradientIn 0.4s ease-out forwards !important;
    stroke-dasharray: none !important;
    stroke-dashoffset: 0 !important;
  }

  @keyframes traceAndErase {
    /* Offset pushed to 105 to hide round line-caps */
    0% { stroke-dashoffset: 105; opacity: 0; }
    15% { opacity: 1; stroke-dashoffset: 60; }
    40%, 60% { stroke-dashoffset: 0; opacity: 1; }
    85% { opacity: 1; stroke-dashoffset: -60; }
    100% { stroke-dashoffset: -105; opacity: 0; }
  }
  @keyframes gradientIn { to { opacity: 0.1; } }

  /* Replay button */
  .replay-btn {
    position: fixed; bottom: 32px; right: 32px;
    background: #0000FF; color: white; border: none;
    padding: 12px 24px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; cursor: pointer; border-radius: 4px;
  }
  .replay-btn:hover { background: #00008B; }
</style>
</head>

<button class="replay-btn" onclick="replay()">Replay</button>

<script>
function replay() {
  const svg = document.querySelector('.icon-biometric-trace');
  const clone = svg.cloneNode(true);
  svg.parentNode.replaceChild(clone, svg);
}
</script>
