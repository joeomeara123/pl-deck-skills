<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent-swarm — Autonomous AI Agents v1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, -apple-system, sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 80px;
  }
  h1 { font-size: 1.4rem; font-weight: 300; letter-spacing: -0.01em; }
  h1 span { font-weight: 600; color: #0000FF; }
  .subtitle {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.12em; color: rgba(0,0,255,0.45);
  }
  .icon-card {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .icon-card svg { width: 160px; height: 160px; }
  .icon-name { font-size: 13px; font-weight: 500; color: #1a1a1a; }
  .icon-tags { font-size: 10px; font-weight: 400; color: #94a3b8; }

  /* ═══════════════════════════════════════════════════ */
  /*  AGENT SWARM — Independent orbits on 3x3 track grid */
  /*  Linear rotation (agents move at constant speed)    */
  /* ═══════════════════════════════════════════════════ */
  .agent-orbit {
    animation: agentSpin 6s linear infinite;
  }
  .agent-orbit-rev {
    animation: agentSpinRev 7s linear infinite;
  }
  .agent-orbit-fast {
    animation: agentSpin 4s linear infinite;
  }

  @keyframes agentSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes agentSpinRev {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  .icon-agent-swarm .icon-gradient {
    opacity: 0;
    animation: gradientIn 0.4s ease-out forwards;
  }
  @keyframes gradientIn { to { opacity: 0.08; } }

  /* Replay */
  .replay-btn {
    position: fixed; bottom: 32px; right: 32px;
    background: #0000FF; color: white; border: none;
    padding: 12px 24px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; cursor: pointer; border-radius: 4px;
  }
  .replay-btn:hover { background: #00008B; }
</style>
</head>
<body>

<div class="subtitle">AI / Autonomous Agents / v1</div>
<h1>agent-swarm — <span>orbital intelligence</span></h1>

<div class="icon-card">
  <svg class="icon-agent-swarm" viewBox="0 0 48 48">
    <defs>
      <linearGradient id="stroke-grad-fingerprint" x1="24" y1="0" x2="24" y2="48" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0000FF"/>
        <stop offset="100%" stop-color="#1a1a1a"/>
      </linearGradient>
    </defs>

    <g class="icon-inner">
      <!-- The 9 Tracks — thin (0.75), full-opacity gradient for visibility -->
      <g stroke="url(#stroke-grad-fingerprint)" stroke-width="0.75" fill="none">
        <circle cx="12" cy="12" r="8" />
        <circle cx="24" cy="12" r="8" />
        <circle cx="36" cy="12" r="8" />
        <circle cx="12" cy="24" r="8" />
        <circle cx="24" cy="24" r="8" />
        <circle cx="36" cy="24" r="8" />
        <circle cx="12" cy="36" r="8" />
        <circle cx="24" cy="36" r="8" />
        <circle cx="36" cy="36" r="8" />
      </g>

      <!-- The Autonomous Agents (Dots) — positioned on circumference (r=8) -->
      <!-- Top Left Orbit -->
      <g class="agent-orbit" style="transform-origin: 12px 12px; animation-delay: -2.1s;">
        <circle cx="12" cy="4" r="1.5" fill="url(#stroke-grad-fingerprint)" />
      </g>
      <!-- Top Right Orbit (Reverse) -->
      <g class="agent-orbit-rev" style="transform-origin: 36px 12px; animation-delay: -0.8s;">
        <circle cx="36" cy="4" r="1.5" fill="url(#stroke-grad-fingerprint)" />
      </g>
      <!-- Center Left Orbit -->
      <g class="agent-orbit" style="transform-origin: 12px 24px; animation-delay: -3.5s;">
        <circle cx="12" cy="16" r="1.5" fill="url(#stroke-grad-fingerprint)" />
      </g>
      <!-- Center Orbit (Fast) -->
      <g class="agent-orbit-fast" style="transform-origin: 24px 24px; animation-delay: -1.2s;">
        <circle cx="24" cy="16" r="1.5" fill="url(#stroke-grad-fingerprint)" />
      </g>
      <!-- Center Right Orbit -->
      <g class="agent-orbit" style="transform-origin: 36px 24px; animation-delay: -4.2s;">
        <circle cx="36" cy="16" r="1.5" fill="url(#stroke-grad-fingerprint)" />
      </g>
      <!-- Bottom Center Orbit (Reverse) -->
      <g class="agent-orbit-rev" style="transform-origin: 24px 36px; animation-delay: -2.7s;">
        <circle cx="24" cy="28" r="1.5" fill="url(#stroke-grad-fingerprint)" />
      </g>
    </g>
  </svg>
  <div class="icon-name">agent-swarm</div>
  <div class="icon-tags">AI agents · autonomous · multi-agent · orchestration · swarm intelligence</div>
</div>

<button class="replay-btn" onclick="replay()">Replay</button>

<script>
function replay() {
  const svg = document.querySelector('.icon-agent-swarm');
  const clone = svg.cloneNode(true);
  svg.parentNode.replaceChild(clone, svg);
}
</script>

</body>
</html>
